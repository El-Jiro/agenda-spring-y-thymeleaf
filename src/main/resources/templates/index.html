<!DOCTYPE html>
<!--Importamos el namespace de Thymeleaf-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/cabecera::cabecera-seccion(titulo='Agenda de Contactos - Inicio')}">
</head>

<body>
    <style>
        table thead tr th {
            background-color: #0D6EFD !important;
            color: white !important;
        }
    </style>
    <!--div de la barra de navegación-->
    <div th:replace="~{fragmentos/navegación::navegacion-seccion}"></div>
    <div class="container">
        <div class="container text-center" style="margin: 30px;">
            <h2>Agenda de contactos</h2>
        </div>
    </div>
    <div class="container text-center">
        <table class="table table-striped table-bordered table-hover align-middle">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Nombre</th>
                    <th scope="col">Télefono</th>
                    <th scope="col">Correo</th>
                    <th scope="col">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <!--Agregamos la directiva each de Thymeleaf, especificamos el nombre de la
                variable iteradora seguido de dos puntos y el nombre de nuestro objeto de modelo
                con la sintaxis de expression language-->
                <tr th:each="contacto:${contactos}">
                    <!--Ahora en los td agregamos la directiva text de Thymeleaf
                    y accedemos a las propiedades del objeto contacto con expression language-->
                    <td th:text="${contacto.idContacto}" scope="row"></td>
                    <td th:text="${contacto.nombre}"></td>
                    <td th:text="${contacto.telefono}"></td>
                    <td th:text="${contacto.correo}"></td>
                    <!--Agregamos un link para el formulario de editar estilizado como botón-->
                    <td class="text-center">
                        <!--Utilizamos las urls dinámicas de thymeleaf con @{} usando el atributo th:href,
                        la primera parte de la url será la ruta /editar, después le pasamos la variable
                        de ruta id entre llaves, posteriormente abrimos paréntesis para esepecificar el
                        valor de dicho id, y finalemnte accedemos al atributo idContacto con expression language-->
                        <a class="btn btn-warning btn-sm" style="font-weight:500"
                           th:href="@{/editar/id(id=${contacto.idContacto})}">
                            <i class="fa-solid fa-pen-to-square"></i> Editar
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <!--Esto se reemplazará por el fragmento al renderizar la vista-->
    <div th:replace="~{fragmentos/pie-pagina::pie-pagina-seccion}"></div>
</body>
</html>
